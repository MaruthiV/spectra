<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spectra · WebGPU smoke test</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 15px;
        color: #1a1a1a;
        line-height: 1.5;
      }
      body {
        max-width: 880px;
        margin: 24px auto;
        padding: 0 16px 64px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      .sub {
        color: #666;
        margin-bottom: 16px;
        font-size: 0.92rem;
      }
      section {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin: 12px 0;
        background: #fafafa;
      }
      section h2 {
        margin-top: 0;
        font-size: 1.05rem;
      }
      #init-label {
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 0.85rem;
        color: #555;
        white-space: pre-wrap;
      }
      #log {
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 0.82rem;
        background: #1e1e1e;
        color: #e0e0e0;
        padding: 12px;
        border-radius: 6px;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #completion {
        white-space: pre-wrap;
        background: #f5f5f5;
        padding: 10px 12px;
        border-radius: 6px;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 0.88rem;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        background: #0e6cad;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .stat {
        display: inline-block;
        background: #e9f4fc;
        padding: 2px 8px;
        margin: 0 4px;
        border-radius: 4px;
        color: #0e6cad;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Spectra · WebGPU smoke test</h1>
    <div class="sub">
      Phase 3 / step 1: load a stock MLC model via <code>@mlc-ai/web-llm</code>
      and run greedy decode. Establishes the loading + inference pattern before
      Spectra's spec controller goes in.
    </div>

    <section>
      <h2>Engine status</h2>
      <div id="init-label">(idle)</div>
    </section>

    <section>
      <h2>Run</h2>
      <div class="row">
        <button id="run-stock">Stock 0.5B greedy baseline</button>
        <button id="run-spectra">Spectra-compiled 0.5B greedy</button>
        <button id="run-spec">⚡ Speculative decoding (1.5B target + 0.5B draft)</button>
      </div>
    </section>

    <section>
      <h2>Result</h2>
      <div>
        <span id="stats"></span>
      </div>
      <div id="completion">(no output yet)</div>
    </section>

    <section>
      <h2>Console log</h2>
      <div id="log"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
